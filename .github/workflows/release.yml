name: Release Build

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 6.2.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.3'

      - name: Build universal release binary (arm64 + x86_64)
        run: swift build -c release --scratch-path _build/swiftpm --arch arm64 --arch x86_64

      - name: Generate app icon
        run: ./scripts/generate_app_icon.sh || echo "Icon generation skipped (no display or missing tools)"

      - name: Create app bundle
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          mkdir -p _build/release
          ./scripts/make_macos_app_bundle.sh \
            _build/swiftpm/apple/Products/Release/CaddyApp \
            _build/release/CaddyApp.app \
            CaddyApp \
            com.frankhildebrandt.CaddyApp \
            "$VERSION" \
            14.0

      - name: Show binary architectures
        run: |
          file _build/release/CaddyApp.app/Contents/MacOS/CaddyApp
          lipo -archs _build/release/CaddyApp.app/Contents/MacOS/CaddyApp

      - name: Zip app bundle
        run: |
          cd _build/release
          zip -r CaddyApp.zip CaddyApp.app

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: _build/release/CaddyApp.zip
          asset_name: CaddyApp.zip
          asset_content_type: application/zip
